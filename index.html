<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت و ساخت ساب‌اسکریپشن</title>
    <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 31, 49, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #10b981;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.6rem;
            color: #fff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.88rem;
            color: #d1d5db;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 12px 40px 12px 14px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-generate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-generate:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .result-box {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: none;
        }

        .result-box.active {
            display: block;
        }

        .output-group {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .output-group input {
            background: transparent;
            border: none;
            padding: 0;
            font-size: 0.85rem;
            color: var(--accent);
            direction: ltr;
            text-align: left;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--accent);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-shield-halved"></i> ساخت لینک ساب‌اسکریپشن</h1>
            <p>اطلاعات کانفیگ مورد نظر را وارد کرده و لینک خروجی را دریافت کنید</p>
        </div>

        <form id="subForm">
            <div class="form-group">
                <label>نام نام کاربری / کانفیگ</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="configName" placeholder="مثال: User-1" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>حجم (گیگابایت)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-database"></i>
                        <input type="number" id="volume" placeholder="مثال: 50" value="50" min="1" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>مدت اعتبار (روز)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-calendar-days"></i>
                        <input type="number" id="days" placeholder="مثال: 30" value="30" min="1" required>
                    </div>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>نوع آی‌پاد (IP)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-network-wired"></i>
                        <select id="ipType">
                            <option value="ipv4">IPv4 (پیش‌فرض)</option>
                            <option value="ipv6">IPv6</option>
                            <option value="dual">Dual Stack</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>حالت اتصال (Mode)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-bolt"></i>
                        <select id="connMode">
                            <option value="standard">Standard</option>
                            <option value="vip">VIP ⭐️</option>
                            <option value="tunnel">Tunnel 🔀</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-generate">
                <i class="fa-solid fa-wand-magic-sparkles"></i> ساخت لینک ساب
            </button>
        </form>

        <div class="result-box" id="resultBox">
            <div class="form-group">
                <label>لینک ساب‌اسکریپشن تولید شده:</label>
                <div class="output-group">
                    <input type="text" id="subUrl" readonly>
                    <button class="btn-copy" onclick="copyLink()"><i class="fa-regular fa-copy"></i> کپی</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">لینک با موفقیت کپی شد!</div>

    <script>
        document.getElementById('subForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('configName').value.trim();
            const volume = document.getElementById('volume').value;
            const days = document.getElementById('days').value;
            const ipType = document.getElementById('ipType').value;
            const mode = document.getElementById('connMode').value;

            // ساخت لینک بر اساس اطلاعات ورودی
            const baseUrl = window.location.origin + window.location.pathname;
            const generatedSub = `${baseUrl}?sub=${encodeURIComponent(name)}&gb=${volume}&days=${days}&ip=${ipType}&mode=${mode}`;

            document.getElementById('subUrl').value = generatedSub;
            document.getElementById('resultBox').classList.add('active');
        });

        function copyLink() {
            const input = document.getElementById('subUrl');
            input.select();
            document.execCommand('copy');

            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
  </html>
